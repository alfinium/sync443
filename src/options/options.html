<!-- Texts: data-i18n="key" (text) and data-i18n-aria-label="key", from _locales/<language>/messages.json (i18n.mjs). -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.mjs"></script>
</head>
<body>
  <header class="page-header">
    <img src="../icons/sync443.svg" alt="" width="40" height="40">
    <div>
      <h1>Sync443</h1>
      <p class="subtitle" data-i18n="optionsSubtitle"></p>
    </div>
  </header>

  <main>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <!-- Shown when the page is opened outside Thunderbird, where there is no i18n: English, the default language. -->
    <p id="outside" class="notice error" role="alert" data-i18n="pageOutsideThunderbird" hidden>This page only works when opened from Thunderbird, in the extension's settings.</p>

    <section class="card" aria-labelledby="mailboxes-title">
      <div class="section-head">
        <h2 id="mailboxes-title" data-i18n="mailboxesTitle"></h2>
        <button type="button" id="add" class="primary" data-i18n="addMailbox"></button>
      </div>
      <p id="mailboxes-empty" class="empty" data-i18n="mailboxesEmpty" hidden></p>
      <ul id="mailboxes" class="mailboxes" aria-labelledby="mailboxes-title"></ul>
    </section>

    <section id="editor" class="card" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title" data-i18n="newMailbox"></h2>
      <form id="form" novalidate>
        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="field">
          <label for="email" data-i18n="fieldEmail"></label>
          <input id="email" name="email" type="email" autocomplete="off" spellcheck="false" maxlength="254" required aria-describedby="email-error">
          <p id="email-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="password" data-i18n="fieldPassword"></label>
          <input id="password" name="password" type="password" autocomplete="off" spellcheck="false" maxlength="1024" aria-describedby="password-hint password-error">
          <p id="password-hint" class="hint" data-i18n="passwordHintNew"></p>
          <p id="password-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="name" data-i18n="fieldName"></label>
          <input id="name" name="name" type="text" autocomplete="off" maxlength="256" aria-describedby="name-hint name-error">
          <p id="name-hint" class="hint" data-i18n="nameHint"></p>
          <p id="name-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="server" data-i18n="fieldServer"></label>
          <input id="server" name="server" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="300" required aria-describedby="server-hint server-error">
          <p id="server-hint" class="hint" data-i18n="serverHint"></p>
          <p id="server-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="username" data-i18n="fieldUsername"></label>
          <input id="username" name="username" type="text" autocomplete="off" spellcheck="false" maxlength="256" aria-describedby="username-hint username-error">
          <p id="username-hint" class="hint" data-i18n="usernameHint"></p>
          <p id="username-error" class="field-error" hidden></p>
        </div>

        <div class="row">
          <div class="field">
            <label for="syncMinutes" data-i18n="fieldFrequency"></label>
            <select id="syncMinutes" name="syncMinutes" aria-describedby="syncMinutes-error"></select>
            <p id="syncMinutes-error" class="field-error" hidden></p>
          </div>
          <div class="field">
            <label for="filterType" data-i18n="fieldPeriod"></label>
            <select id="filterType" name="filterType" aria-describedby="filterType-error"></select>
            <p id="filterType-error" class="field-error" hidden></p>
          </div>
        </div>

        <fieldset id="sync" class="field" aria-describedby="sync-hint sync-error">
          <legend data-i18n="fieldKinds"></legend>
          <div id="kinds" class="kinds"></div>
          <p id="sync-hint" class="hint" data-i18n="kindsHint"></p>
          <p id="sync-error" class="field-error" hidden></p>
        </fieldset>

        <!-- Each one is shown only while its item is checked above (options.mjs); hidden, it keeps its value. -->
        <div class="row">
          <div id="calendarPeriod-field" class="field" hidden>
            <label for="calendarPeriod" data-i18n="fieldCalendarPeriod"></label>
            <select id="calendarPeriod" name="calendarPeriod" aria-describedby="calendarPeriod-hint calendarPeriod-error"></select>
            <p id="calendarPeriod-hint" class="hint" data-i18n="calendarPeriodHint"></p>
            <p id="calendarPeriod-error" class="field-error" hidden></p>
          </div>
          <div id="taskFilter-field" class="field" hidden>
            <label for="taskFilter" data-i18n="fieldTaskFilter"></label>
            <select id="taskFilter" name="taskFilter" aria-describedby="taskFilter-error"></select>
            <p id="taskFilter-error" class="field-error" hidden></p>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="save" class="primary" data-i18n="save"></button>
          <button type="button" id="cancel" data-i18n="cancel"></button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="diag-title">
      <h2 id="diag-title" data-i18n="diagnosticTitle"></h2>
      <p class="hint" data-i18n="diagnosticHint"></p>
      <div class="debug-row">
        <input type="checkbox" id="debug" aria-describedby="debug-status">
        <label for="debug" data-i18n="debugLabel"></label>
        <span id="debug-status" class="hint"></span>
      </div>
      <div class="actions">
        <button type="button" id="log-refresh" data-i18n="logRefresh"></button>
        <button type="button" id="log-clear" data-i18n="logClear"></button>
      </div>
      <pre id="log" class="log" tabindex="0" data-i18n-aria-label="logLabel"></pre>
    </section>
  </main>
</body>
</html>
