# SPDX-License-Identifier: MIT
# Unit tests on Windows, macOS and Linux, on every push and pull request.
name: Tests

on:
  push:
  pull_request:

# Read-only token: the tests never need to write anything.
permissions:
  contents: read

jobs:
  unit:
    name: Tests unitaires (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit, not a tag: a moved tag cannot change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tests unitaires et aléatoires
        run: python -I tools/unit_tests.py
        env:
          JS_SHELL: node
          PYTHONIOENCODING: utf-8
      - name: Vérification du paquet (fichiers, imports, blocs de test retirés)
        run: python -I tools/build_xpi.py --check
        env:
          PYTHONIOENCODING: utf-8
