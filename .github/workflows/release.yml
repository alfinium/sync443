#
# Publication: a pushed tag v<version> (the version of src/manifest.json)
# runs the unit tests, builds dist/sync443-<version>.xpi reproducibly and
# publishes it in the GitHub Releases, with the CHANGELOG.md section of that
# version as release notes.
name: Publication

on:
  push:
    tags:
      - "v*"

# Nothing by default: each job says what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions pinned to a commit, not a tag: a moved tag cannot change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tests unitaires et aléatoires
        run: python -I tools/unit_tests.py
        env:
          JS_SHELL: node
          PYTHONIOENCODING: utf-8
      - name: Vérification du paquet
        run: python -I tools/build_xpi.py --check --expect-version "$TAG"
        env:
          TAG: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8

  release:
    name: Construction et publication
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that may write: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The tag is used through the environment only, never pasted into the script.
      # build_xpi.py refuses it unless it is exactly v<version of the manifest>.
      - name: Construction
        run: python -I tools/build_xpi.py --expect-version "$TAG" --notes dist/notes.md
        env:
          TAG: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8
      - name: Publication dans les Releases
        run: |
          version="${TAG#v}"
          gh release create "$TAG" "dist/sync443-${version}.xpi" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sync443 ${version}" \
            --notes-file dist/notes.md
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
